services:
  mysql:
    image: mysql:8.4
    container_name: psfish-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: fishingapp
      MYSQL_USER: fishingapp
      MYSQL_PASSWORD: fishingapp
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
